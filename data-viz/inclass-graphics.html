<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Baltimore Heat Data Visualizations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <main class="container my-5">

        <h1 class="text-center mb-4">
            Baltimore Heat Data
        </h1>

        <p class="text-center mb-5">
            Two visualizations exploring extreme heat
            in Baltimore and Maryland.
        </p>

        <div class="row justify-content-center">

            <div class="col-md-10 mb-5">
                <iframe title="Indoor and outdoor heat index during Baltimore heat wave, July 16-22, 2019]" aria-label="Line chart" id="datawrapper-chart-LzEK5" src="https://datawrapper.dwcdn.net/LzEK5/1/" scrolling="no" frameborder="0" style="width: 0; min-width: 100% !important; border: none;" height="436" data-external="1"></iframe><script type="text/javascript">(function(){function e(){window.addEventListener(`message`,function(e){if(e.data[`datawrapper-height`]!==void 0){var t=document.querySelectorAll(`iframe`);for(var n in e.data[`datawrapper-height`])for(var r=0,i;i=t[r];r++)if(i.contentWindow===e.source){var a=e.data[`datawrapper-height`][n]+`px`;i.style.height=a}}})}e()})();</script>
            </div>

            <div class="col-md-10 mb-5">
                <iframe title="Baltimore has more than its share of heat-related deaths in Maryland]" aria-label="Grouped column chart" id="datawrapper-chart-nAHnF" src="https://datawrapper.dwcdn.net/nAHnF/1/" scrolling="no" frameborder="0" style="width: 0; min-width: 100% !important; border: none;" height="588" data-external="1"></iframe><script type="text/javascript">(function(){function e(){window.addEventListener(`message`,function(e){if(e.data[`datawrapper-height`]!==void 0){var t=document.querySelectorAll(`iframe`);for(var n in e.data[`datawrapper-height`])for(var r=0,i;i=t[r];r++)if(i.contentWindow===e.source){var a=e.data[`datawrapper-height`][n]+`px`;i.style.height=a}}})}e()})();</script>
            </div>

        </div>

    </main>

</body>
</html>
